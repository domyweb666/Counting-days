<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理行事曆 預覽</title>
<style>
  :root {
    --bg: #F3F3F5; --card: #FFFFFF; --ink: #1C1C1E; --sub: #5C5C60;
    --sep: #E5E1D8; --accent: #4F6B57; --strong: #3F5746; --soft: #E3ECE5;
    --muted: #ECEAE4; --danger: #C4372C; --page: #D9D9DE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--page); color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .note { max-width: 860px; margin: 0 auto 20px; font-size: 14px; line-height: 1.6; color: #3a3a3e; }
  .wrap { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
  figure { margin: 0; }
  figcaption { text-align: center; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .phone {
    width: 375px; max-width: 100%; height: 780px; background: var(--bg); border-radius: 36px;
    overflow-y: auto; padding: 20px 20px 32px; box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  .top { display: flex; justify-content: flex-end; }
  .pill {
    background: var(--card); color: var(--strong); font-weight: 600; font-size: 16px;
    padding: 9px 18px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  h1 { font-size: 32px; margin: 14px 0 16px; }
  h2 { font-size: 20px; margin: 22px 4px 8px; }
  .card { background: var(--card); border-radius: 18px; padding: 0 16px; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--sep); }
  .grow { flex: 1; min-width: 0; }
  .title { font-size: 17px; overflow-wrap: anywhere; }
  .acct { font-size: 13px; color: var(--sub); }
  .value { font-size: 16px; color: var(--sub); }
  .chev { color: #B0B0B5; font-size: 18px; }
  .foot { font-size: 13.5px; line-height: 1.55; color: var(--sub); margin: 8px 4px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .icon {
    width: 28px; height: 28px; flex: none; display: grid; place-items: center;
    color: var(--accent); font-size: 18px;
  }
  .minus {
    width: 24px; height: 24px; border-radius: 50%; background: var(--danger); flex: none;
    display: grid; place-items: center; color: #fff; font-weight: 700; line-height: 1;
  }
  .cap {
    background: var(--soft); color: var(--strong); font-weight: 600; font-size: 15px;
    padding: 6px 12px; border-radius: 999px; white-space: nowrap; flex: none;
  }
  .cap small { font-size: 10px; margin-left: 4px; }
  .grip { color: #B8B8BD; font-size: 20px; letter-spacing: -2px; flex: none; }
  .plus {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--accent); flex: none;
    display: grid; place-items: center; color: var(--accent); font-weight: 700; line-height: 1;
  }
  .field { color: #A9A9AE; font-size: 17px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(#f66,#fc5,#6c6,#5cf,#96f,#f66); padding: 4px; }
  .swatch i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--accent); border: 2px solid #fff; }
  .create { justify-content: center; color: var(--strong); font-weight: 600; font-size: 17px; opacity: .5; }
  .faded { opacity: .45; }
</style>
</head>
<body>
<p class="note">這是照程式的排法手畫的示意，顏色用你截圖裡的綠色主題。字級、間距、清單的圓角跟手機上會有一點出入，實際樣子以 TestFlight 為準。按鈕都點不動。</p>

<div class="wrap">
  <figure>
    <figcaption>設定首頁（行事曆那一段）</figcaption>
    <div class="phone">
      <div class="card faded">
        <div class="row"><div class="grow"><div class="title">今天　晴時有雲 · 19–27° · 降雨 0%</div><div class="acct">上次更新：今天 14:20</div></div></div>
      </div>
      <p class="foot faded">打開後，蒜日子會連網向 Apple 天氣查你選的縣市未來十天的預報。只送縣市，不送行程。</p>

      <h2>行事曆</h2>
      <div class="card">
        <div class="row">
          <div class="icon">☰</div>
          <div class="grow title">管理行事曆</div>
          <div class="value">3 本</div>
          <div class="chev">›</div>
        </div>
      </div>
      <p class="foot">加入、移除、排順序，或指定哪一本是節日、預設歸哪一類。這些都只改蒜日子的顯示方式，不會動到系統行事曆。</p>

      <div class="card faded" style="margin-top:22px">
        <div class="row"><div class="icon">◇</div><div class="grow title">類別與顏色</div><div class="chev">›</div></div>
      </div>
      <p class="foot faded">改類別的名稱、顏色，或指定哪一類優先當主事件。</p>
    </div>
  </figure>

  <figure>
    <figcaption>管理行事曆</figcaption>
    <div class="phone">
      <div class="top"><span class="pill">完成</span></div>
      <h1>管理行事曆</h1>

      <h2>已加入的</h2>
      <div class="card">
        <div class="row">
          <div class="minus">−</div><div class="dot" style="background:#FF9230"></div>
          <div class="grow"><div class="title">台灣節日</div><div class="acct">訂閱的行事曆</div></div>
          <div class="cap">節日<small>◆</small></div><div class="grip">≡</div>
        </div>
        <div class="row">
          <div class="minus">−</div><div class="dot" style="background:#A5DDE4"></div>
          <div class="grow"><div class="title">charlie@domyweb.org</div><div class="acct">Google</div></div>
          <div class="cap">行程<small>◆</small></div><div class="grip">≡</div>
        </div>
        <div class="row">
          <div class="minus">−</div><div class="dot" style="background:#1483F5"></div>
          <div class="grow"><div class="title">charlie8130@gmail.com</div><div class="acct">Gmail</div></div>
          <div class="cap">行程<small>◆</small></div><div class="grip">≡</div>
        </div>
      </div>
      <p class="foot">按住右邊的三條線上下拖可以排順序：開始時間一樣的行程，排前面的行事曆會顯示在上面。紅色減號是從蒜日子移除，系統行事曆裡還在，下面可以加回來。膠囊是這本行事曆的預設類別，選「節日」就變成日期下的小字；行程自己選過類別的，照它自己的。</p>

      <h2>手機上還沒加入的</h2>
      <div class="card">
        <div class="row">
          <div class="dot" style="background:#B36AE2"></div>
          <div class="grow"><div class="title">生日</div><div class="acct">其他</div></div>
          <div class="plus">+</div>
        </div>
      </div>
      <p class="foot">訂閱行事曆和節日行事曆要到 iPhone 的「行事曆」app 加。加好之後回到蒜日子，它會自動出現在上面。</p>

      <h2>建立新的行事曆</h2>
      <div class="card">
        <div class="row"><div class="grow field">名稱</div></div>
        <div class="row"><div class="grow title">顏色</div><div class="swatch"><i></i></div></div>
        <div class="row create">建立</div>
      </div>
      <p class="foot">會寫進 iPhone 的行事曆：有開 iCloud 行事曆就放在 iCloud，沒有就放在這支手機上。之後要刪掉它，得到 iPhone 的行事曆 app 刪。</p>
    </div>
  </figure>
</div>
</body>
</html>
