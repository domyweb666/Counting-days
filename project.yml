# 這份檔案給 XcodeGen 用：雲端建置時由它產生 Xcode 專案，repo 裡不放 .xcodeproj。
name: SuanRiZi
options:
  bundleIdPrefix: com.domyweb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
packages:
  CalendarCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SuanRiZi:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CalendarCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 蒜日子
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCalendarsFullAccessUsageDescription: 蒜日子需要讀取你的行事曆，才能把行程畫成月曆；新增與修改行程時會寫回系統行事曆。蒜日子不會把行程傳到任何伺服器，只有你自己按「分享」時才會送出那一筆。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domyweb.countingdays
        PRODUCT_NAME: SuanRiZi
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
